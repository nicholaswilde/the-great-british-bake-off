name: Scheduled Ingestion & Series Tracking

on:
  schedule:
    # Run every Wednesday at 06:00 UTC (after Tuesday night GBBO UK broadcast)
    - cron: '0 6 * * 3'
  workflow_dispatch:
    inputs:
      series:
        description: 'Specific series number to ingest (leave blank for latest series)'
        type: string
        default: ''
      force:
        description: 'Force re-scraping and pipeline rebuild even if series exists'
        type: boolean
        default: false
      open_pr:
        description: 'Open a Pull Request if new data is ingested'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    name: Check & Ingest New Broadcast Data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos

      - name: Install dependencies
        run: task sync

      - name: Run Scheduled Ingestion & Tracking
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.open_pr }}" = "true" ]; then
            ARGS="${ARGS} --open-pr"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="${ARGS} --force"
          fi
          if [ -n "${{ github.event.inputs.series }}" ]; then
            ARGS="${ARGS} --series ${{ github.event.inputs.series }}"
          fi

          ./scripts/schedule_ingest.py ${ARGS}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
