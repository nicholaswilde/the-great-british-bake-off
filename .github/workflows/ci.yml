name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Ruff Cache
        uses: actions/cache@v4
        with:
          path: .ruff_cache
          key: ruff-cache-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            ruff-cache-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-
            ruff-cache-${{ runner.os }}-

      - name: Install dependencies
        run: task sync

      - name: Lint Python Code
        run: task lint:py

      - name: Check Code Formatting
        run: task format:check

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Pytest Cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            pytest-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            pytest-cache-${{ runner.os }}-

      - name: Install dependencies
        run: task sync

      - name: Run Test Suite with Branch Coverage
        run: task test:coverage

      - name: Upload Coverage to Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: task coverage:upload
        continue-on-error: true

  pipeline:
    name: Data Pipeline & Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task sync

      - name: Rebuild Pipeline & Verify Fresh Artifacts
        run: |
          task build
          task export:arrow
          task export:r
          task export:ai
          task eval:benchmark
          task validate
          git diff --exit-code data/ docs/

  typos:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check spelling
        uses: crate-ci/typos@v1

  ci-status:
    name: CI Status
    needs: [lint, test, pipeline, typos]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.pipeline.result }}" != "success" ] || \
             [ "${{ needs.typos.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All parallel CI jobs succeeded!"
