name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0; leave blank to use pyproject.toml)'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pre-Release Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos

      - name: Install dependencies
        run: task sync

      - name: Rebuild Fresh Pipeline Artifacts & Run Quality Checks
        run: task pipeline

  package:
    name: Build Release Asset Packages
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      draft: ${{ steps.vars.outputs.draft }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task sync

      - name: Determine Release Version & Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(python3 -c "import re, pathlib; print(re.search(r'version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text()).group(1))")
            TAG="v${VERSION}"
          fi
          DRAFT="${{ github.event.inputs.draft }}"
          if [ -z "$DRAFT" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              DRAFT="false"
            else
              DRAFT="true"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"

      - name: Build Segmented Release Packages
        run: |
          task package -- --version "${{ steps.vars.outputs.tag }}"

      - name: Upload Built Release Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.whl
            dist/release/checksums.txt
            dist/release/manifest.json
          retention-days: 1

  publish:
    name: Publish Release & Sync Hub
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Built Release Assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          name: Release ${{ needs.package.outputs.tag }}
          files: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.whl
            dist/release/checksums.txt
            dist/release/manifest.json
          generate_release_notes: true
          draft: ${{ needs.package.outputs.draft == 'true' }}
          prerelease: ${{ contains(needs.package.outputs.tag, '-rc') || contains(needs.package.outputs.tag, '-beta') || contains(needs.package.outputs.tag, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        if: env.HF_TOKEN != '' && needs.package.outputs.draft != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Set up Python
        if: env.HF_TOKEN != '' && needs.package.outputs.draft != 'true'
        run: uv python install
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Install Task
        if: env.HF_TOKEN != '' && needs.package.outputs.draft != 'true'
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Install dependencies
        if: env.HF_TOKEN != '' && needs.package.outputs.draft != 'true'
        run: task sync
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Publish Dataset to Hugging Face Hub
        if: env.HF_TOKEN != '' && needs.package.outputs.draft != 'true'
        run: |
          task publish:hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
