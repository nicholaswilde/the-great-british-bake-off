# https://taskfile.dev
version: '3'

dotenv: ['.env']

vars:
  PYTHON_FILES: src tests scripts

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  # Dependency & Environment Management
  setup:
    desc: Setup environment and sync dependencies
    cmds:
      - uv sync --all-extras

  sync:
    desc: Sync dependencies including all extras via uv
    cmds:
      - uv sync --all-extras

  lock:
    desc: Lock project dependencies via uv
    cmds:
      - uv lock

  # Scrape & Build Pipelines
  scrape:
    desc: Scrape Wikipedia tables for GBBO series
    cmds:
      - uv run gbbo scrape {{.CLI_ARGS}}

  scrape:fandom:
    desc: Scrape GBBO Fandom wiki lore, technical recipes, and judging quotes
    cmds:
      - uv run gbbo scrape-fandom {{.CLI_ARGS}}

  scrape:reddit:
    desc: Ingest Reddit episode discussion threads and community sentiment
    cmds:
      - uv run gbbo scrape-reddit {{.CLI_ARGS}}

  scrape:all:
    desc: Run all multi-source scrapers (Wikipedia, Fandom, Reddit)
    cmds:
      - task: scrape
      - task: scrape:fandom
      - task: scrape:reddit

  build:
    desc: Aggregate and validate raw data into processed datasets
    cmds:
      - uv run gbbo build {{.CLI_ARGS}}

  enrich:ray:
    desc: Enrich processed datasets with demographics, handshakes, and streaming data from RayofData
    cmds:
      - uv run gbbo enrich {{.CLI_ARGS}}

  nlp:flavors:
    desc: Extract NLP flavor profiles, bake styles, and outcome statistics
    cmds:
      - uv run gbbo extract-flavors {{.CLI_ARGS}}

  pipeline:
    desc: Rebuild all tidy tables, SQLite, Arrow, HuggingFace datasets, and AI corpora
    cmds:
      - task: build
      - task: export:arrow
      - task: export:r
      - task: export:ai
      - task: eval:benchmark
      - task: check

  # Visualizations & Brand Assets
  images:
    desc: Generate publication data visualisations and hex branding assets (dev/images/)
    cmds:
      - uv run --with matplotlib --with seaborn --with pillow --with pandas python dev/scripts/generate_images.py

  # Dataset Completeness & Gap Auditing
  gaps:
    desc: Audit dataset completeness and print missing cell metrics
    cmds:
      - uv run gbbo gaps {{.CLI_ARGS}}

  gaps:detail:
    desc: Print detailed column-level and series breakdown of dataset gaps
    cmds:
      - uv run gbbo gaps --detail {{.CLI_ARGS}}

  gaps:report:
    desc: Export markdown dataset gap report to docs/dataset_gaps.md
    cmds:
      - uv run gbbo gaps --detail --export-md docs/dataset_gaps.md

  stats:
    desc: Display row count statistics for all processed tables
    cmds:
      - uv run gbbo stats {{.CLI_ARGS}}

  # Empirical Predictive Modeling Engine
  predict:
    desc: Run empirical predictive modeling engine for in-progress series
    cmds:
      - uv run gbbo predict {{.CLI_ARGS}}

  predict:update:
    desc: Run predictive engine and update documentation (docs/predictions.md and README.md)
    cmds:
      - uv run gbbo predict --update-docs {{.CLI_ARGS}}

  # Multi-Format Serialization & Exports
  export:sqlite:
    desc: Export processed tables into a unified SQLite database (data/processed/gbbo.db)
    cmds:
      - uv run gbbo export-sqlite {{.CLI_ARGS}}

  export:arrow:
    desc: Export tables to Apache Arrow IPC files and Parquet tables
    cmds:
      - uv run gbbo export-arrow {{.CLI_ARGS}}

  export:r:
    desc: Export datasets to native R formats (.rds, .rda) and companion R package (r/)
    cmds:
      - uv run gbbo export-r {{.CLI_ARGS}}

  export:ai:
    desc: Export datasets into AI training formats (Chat SFT JSONL, RAG corpus, and benchmark suite)
    cmds:
      - uv run gbbo export-ai {{.CLI_ARGS}}

  export:geojson:
    desc: Export baker hometown coordinates to standard GeoJSON (data/processed/bakers.geojson)
    cmds:
      - uv run gbbo export-geojson {{.CLI_ARGS}}

  export:all:
    desc: Export datasets across all formats (SQLite, Arrow IPC, Parquet, R, AI corpora, GeoJSON)
    cmds:
      - task: export:sqlite
      - task: export:arrow
      - task: export:r
      - task: export:ai
      - task: export:geojson


  eval:benchmark:
    desc: Run evaluation on The Great British Bake Off AI benchmark suite
    cmds:
      - uv run gbbo eval-benchmark {{.CLI_ARGS}}

  publish:hf:
    desc: Publish and synchronize datasets and AI corpora to Hugging Face Hub
    cmds:
      - uv run gbbo publish-hf {{.CLI_ARGS}}


  # Testing & Coverage
  test:
    desc: Run pytest test suite
    cmds:
      - uv run --extra dev pytest {{.CLI_ARGS}}

  test:coverage:
    desc: Run pytest test suite with code coverage
    cmds:
      - uv run --extra dev pytest --cov=gbbo_dataset --cov-report=term-missing --cov-report=xml --cov-report=lcov {{.CLI_ARGS}}

  coverage:report:
    desc: Generate HTML test coverage report
    cmds:
      - uv run --extra dev pytest --cov=gbbo_dataset --cov-report=html

  coverage:upload:
    desc: Upload test coverage results to Coveralls.io
    cmds:
      - uv run --extra dev coveralls

  # Code Quality & Formatting
  lint:
    desc: Lint Python code with ruff and check spelling with typos
    cmds:
      - task: lint:py
      - task: spellcheck

  lint:fix:
    desc: Lint and fix issues with ruff and typos
    cmds:
      - task: lint:py:fix
      - task: spellcheck:fix

  lint:py:
    desc: Lint Python source code with ruff
    cmds:
      - uv run ruff check {{.PYTHON_FILES}} {{.CLI_ARGS}}

  lint:py:fix:
    desc: Lint and fix issues with ruff
    cmds:
      - uv run ruff check --fix {{.PYTHON_FILES}} {{.CLI_ARGS}}

  format:
    desc: Format Python code with ruff
    cmds:
      - uv run ruff format {{.PYTHON_FILES}} {{.CLI_ARGS}}

  format:check:
    desc: Check formatting with ruff without modifying files
    cmds:
      - uv run ruff format --check {{.PYTHON_FILES}}

  spellcheck:
    desc: Check spelling across repository with typos
    cmds:
      - typos {{.CLI_ARGS}}

  spellcheck:fix:
    desc: Fix spelling errors with typos automatically
    cmds:
      - typos --write-changes {{.CLI_ARGS}}

  spellcheck-file:
    desc: Check spelling on a specific file (e.g. task spellcheck-file FILE=path)
    cmds:
      - typos {{.FILE}}

  # Complete Pre-commit Verification
  validate:
    desc: Validate processed datasets for schema and relational integrity
    cmds:
      - uv run gbbo validate

  check:
    desc: Run complete verification suite (format check, lint, spellcheck, tests, and validation)
    cmds:
      - task: format:check
      - task: lint
      - task: test
      - task: validate

  # Interactive Web Dashboard & Containerization
  dashboard:
    desc: Launch interactive Streamlit web dashboard
    cmds:
      - uv run gbbo dashboard {{.CLI_ARGS}}

  docker:build:
    desc: Build the GBBO dashboard Docker container image
    cmds:
      - docker build --load -t the-great-british-bake-off:latest .

  docker:run:
    desc: Run the GBBO dashboard Docker container
    cmds:
      - docker run --rm -p 8501:8501 the-great-british-bake-off:latest

  docker:up:
    desc: Start the GBBO dashboard service using Docker Compose
    cmds:
      - docker compose up -d

  docker:down:
    desc: Stop the GBBO dashboard service using Docker Compose
    cmds:
      - docker compose down

  # Release & Distribution Packaging
  package:
    desc: Build all release bundles (CSV, Parquet, AI, SQLite, R, Python, and checksums)
    cmds:
      - uv run gbbo package {{.CLI_ARGS}}

  package:csv:
    desc: Build tidy CSV release bundle (gbbo-dataset-csv.zip)
    cmds:
      - uv run gbbo package --component csv {{.CLI_ARGS}}

  package:parquet:
    desc: Build columnar Parquet release bundle (gbbo-dataset-parquet.zip)
    cmds:
      - uv run gbbo package --component parquet {{.CLI_ARGS}}

  package:ai:
    desc: Build AI training datasets release bundle (gbbo-dataset-ai.zip)
    cmds:
      - uv run gbbo package --component ai {{.CLI_ARGS}}

  package:sqlite:
    desc: Build SQLite database release bundle (gbbo-dataset-sqlite.zip)
    cmds:
      - uv run gbbo package --component sqlite {{.CLI_ARGS}}

  package:r:
    desc: Build R companion source package tarball (gbbo_*.tar.gz)
    cmds:
      - uv run gbbo package --component r {{.CLI_ARGS}}

  package:python:
    desc: Build Python distribution wheels and source archive
    cmds:
      - uv run gbbo package --component python {{.CLI_ARGS}}

  package:tidytuesday:
    desc: Build R4DS TidyTuesday intake package bundle (gbbo-dataset-tidytuesday-*.zip)
    cmds:
      - uv run gbbo package --component tidytuesday {{.CLI_ARGS}}

  package:checksums:
    desc: Generate SHA-256 checksums file for release assets
    cmds:
      - uv run gbbo package --component checksums {{.CLI_ARGS}}

  release:
    desc: Automated release tagging, validation, and version bump (./scripts/release.sh)
    cmds:
      - ./scripts/release.sh {{.CLI_ARGS}}

  release:summary:
    desc: Generate categorized release notes and update draft release (./scripts/release_summary.py)
    cmds:
      - ./scripts/release_summary.py {{.CLI_ARGS}}


