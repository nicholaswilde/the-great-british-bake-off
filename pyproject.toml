[project]
name = "the-great-british-bake-off"
version = "0.1.5"
description = "A comprehensive tidy dataset and AI training corpus for The Great British Bake Off"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Nicholas Wilde", email = "nicholas@nicholaswilde.io" },
]
dependencies = [
    "altair>=5.3.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "pandas>=2.2.2",
    "pyarrow>=26.0.0",
    "pydantic>=2.7.0",
    "pyreadr>=0.5.7",
    "requests>=2.32.0",
    "rich>=15.0.0",
    "streamlit>=1.35.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
dev = [
    "coveralls>=4.1.0",
    "huggingface_hub>=0.23.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
gbbo = "gbbo_dataset.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbbo_dataset"]

[tool.ruff.lint]
ignore = ["BLE001", "B008"]

[tool.coverage.run]
source = ["gbbo_dataset"]
branch = true
omit = [
    "tests/*",
]
